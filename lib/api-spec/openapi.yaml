openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: openai
    description: OpenAI AI chat operations
  - name: avi
    description: AVI chatbot specific operations
  - name: account
    description: AVI Plus account operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /openai/conversations:
    get:
      operationId: listOpenaiConversations
      tags: [openai]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiConversation"
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOpenaiConversationBody"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"
  /openai/conversations/{id}:
    get:
      operationId: getOpenaiConversation
      tags: [openai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    delete:
      operationId: deleteOpenaiConversation
      tags: [openai]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /openai/conversations/{id}/messages:
    get:
      operationId: listOpenaiMessages
      tags: [openai]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiMessage"
    post:
      operationId: sendOpenaiMessage
      tags: [openai]
      summary: Send a text message and receive a streaming text response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendOpenaiMessageBody"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}
  /account/me:
    get:
      operationId: getAviAccount
      tags: [account]
      summary: Get the signed-in AVI Plus account
      responses:
        "200":
          description: AVI Plus account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AviAccount"
        "401":
          description: Authentication required
  /account/profile:
    patch:
      operationId: updateAviProfile
      tags: [account]
      summary: Update AVI Plus profile details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAviProfileBody"
      responses:
        "200":
          description: Updated AVI Plus account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AviAccount"
        "401":
          description: Authentication required
  /account/settings:
    patch:
      operationId: updateAviSettings
      tags: [account]
      summary: Update AVI Plus parent settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAviSettingsBody"
      responses:
        "200":
          description: Updated AVI Plus account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AviAccount"
        "401":
          description: Authentication required
  /account/link-anonymous:
    post:
      operationId: linkAnonymousAviSession
      tags: [account]
      summary: Link the current anonymous browser session to the signed-in account
      responses:
        "200":
          description: Link result
          content:
            application/json:
              schema:
                type: object
                properties:
                  linkedCount:
                    type: integer
                required: [linkedCount]
        "401":
          description: Authentication required
  /account/achievements/sync:
    post:
      operationId: syncAviAchievements
      tags: [account]
      summary: Merge browser achievements into the signed-in account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                achievementState:
                  $ref: "#/components/schemas/AviAchievementState"
              required: [achievementState]
      responses:
        "200":
          description: Merged achievement state
          content:
            application/json:
              schema:
                type: object
                properties:
                  achievementState:
                    $ref: "#/components/schemas/AviAchievementState"
                required: [achievementState]
        "401":
          description: Authentication required
  /avi/wikipedia/search:
    get:
      operationId: searchWikipedia
      tags: [avi]
      summary: Search Wikipedia for a topic
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Wikipedia search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WikipediaSearchResponse"
  /avi/wikipedia/random:
    get:
      operationId: getRandomWikipedia
      tags: [avi]
      summary: Get a random Wikipedia article on a topic
      parameters:
        - name: topic
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Random Wikipedia article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WikipediaArticle"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    OpenaiConversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - createdAt
    OpenaiMessage:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - role
        - content
        - createdAt
    CreateOpenaiConversationBody:
      type: object
      properties:
        title:
          type: string
      required:
        - title
    SendOpenaiMessageBody:
      type: object
      properties:
        content:
          type: string
      required:
        - content
    OpenaiConversationWithMessages:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/OpenaiMessage"
      required:
        - id
        - title
        - createdAt
        - messages
    OpenaiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    WikipediaSearchResult:
      type: object
      properties:
        title:
          type: string
        snippet:
          type: string
        url:
          type: string
      required:
        - title
        - snippet
        - url
    WikipediaSearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/WikipediaSearchResult"
      required:
        - results
    WikipediaArticle:
      type: object
      properties:
        title:
          type: string
        summary:
          type: string
        url:
          type: string
      required:
        - title
        - summary
        - url
    AviAchievementState:
      type: object
      properties:
        unlockedIds:
          type: array
          items:
            type: string
        counters:
          type: object
          additionalProperties:
            type: integer
      required:
        - unlockedIds
        - counters
    AviAccountStats:
      type: object
      properties:
        conversationCount:
          type: integer
        messageCount:
          type: integer
      required:
        - conversationCount
        - messageCount
    AviAccount:
      type: object
      properties:
        id:
          type: integer
        aviName:
          type: string
        avatar:
          type: string
        profileBio:
          type: string
        isPlus:
          type: boolean
        parentModeEnabled:
          type: boolean
        dailyLimit:
          type: integer
        dailyMessageCount:
          type: integer
        achievementState:
          $ref: "#/components/schemas/AviAchievementState"
        stats:
          $ref: "#/components/schemas/AviAccountStats"
      required:
        - id
        - aviName
        - avatar
        - profileBio
        - isPlus
        - parentModeEnabled
        - dailyLimit
        - dailyMessageCount
        - achievementState
        - stats
    UpdateAviProfileBody:
      type: object
      properties:
        aviName:
          type: string
          minLength: 1
          maxLength: 30
        avatar:
          type: string
          minLength: 1
          maxLength: 12
        profileBio:
          type: string
          maxLength: 160
    UpdateAviSettingsBody:
      type: object
      properties:
        parentModeEnabled:
          type: boolean
        dailyLimit:
          type: integer
          minimum: 20
          maximum: 500
